<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="zskin" cx="62%" cy="30%" r="80%">
      <stop offset="0" stop-color="#b4dd62"/><stop offset="0.55" stop-color="#6b8f3a"/><stop offset="1" stop-color="#3d5a1c"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4ff3a" stop-opacity="0.9"/><stop offset="1" stop-color="#d4ff3a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="face"><circle r="300"/></clipPath>
  </defs><g transform="translate(512 512) scale(0.95)">
  <defs>
    <radialGradient id="sskin" cx="70%" cy="28%" r="80%">
      <stop offset="0" stop-color="#8fb8ff"/><stop offset="0.55" stop-color="#4f8ef7"/><stop offset="1" stop-color="#2f62c4"/>
    </radialGradient>
    <clipPath id="leftHalf"><path d="M8 -320 L-22 -230 L24 -150 L-18 -70 L22 10 L-20 90 L20 170 L-16 250 L10 320 L-330 320 L-330 -320 Z"/></clipPath>
    <clipPath id="rightHalf"><path d="M8 -320 L-22 -230 L24 -150 L-18 -70 L22 10 L-20 90 L20 170 L-16 250 L10 320 L330 320 L330 -320 Z"/></clipPath>
    <radialGradient id="auraBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#4fa8ff" stop-opacity="0.42"/><stop offset="1" stop-color="#4fa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle r="470" fill="url(#auraBlue)"/>
  <g clip-path="url(#face)">
    <rect x="-320" y="-320" width="640" height="640" fill="url(#zskin)"/>
    <path d="M8 -320 L-22 -230 L24 -150 L-18 -70 L22 10 L-20 90 L20 170 L-16 250 L10 320 L330 320 L330 -320 Z" fill="url(#sskin)"/>
    <ellipse cx="-190" cy="-170" rx="70" ry="45" fill="#3d5a1c" opacity="0.45" transform="rotate(30 -190 -170)"/>
    <ellipse cx="-180" cy="200" rx="50" ry="32" fill="#3d5a1c" opacity="0.4"/>
    <!-- mouth: straight and stitched on the zombie half, a smile on the survivor half -->
    <g clip-path="url(#leftHalf)" stroke="#3a1010" stroke-linecap="round">
      <path d="M-140 110 L40 110" stroke-width="32"/>
      <g stroke-width="17"><path d="M-110 72 L-110 148"/><path d="M-70 72 L-70 148"/><path d="M-30 72 L-30 148"/></g>
    </g>
    <path d="M-140 80 Q0 140 140 80" stroke="#1f3f7a" stroke-width="20" fill="none" stroke-linecap="round" clip-path="url(#rightHalf)"/>
  </g>
  <!-- outline: dark green on the zombie side, dark blue on the survivor side -->
  <circle r="300" fill="none" stroke="#16240c" stroke-width="26" clip-path="url(#leftHalf)"/>
  <circle r="300" fill="none" stroke="#1f3f7a" stroke-width="26" clip-path="url(#rightHalf)"/>
  <!-- tear with stitches -->
  <path d="M8 -320 L-22 -230 L24 -150 L-18 -70 L22 10 L-20 90 L20 170 L-16 250 L10 320" stroke="#16240c" stroke-width="12" fill="none" stroke-linejoin="round"/>
  <g stroke="#16240c" stroke-width="9" stroke-linecap="round">
    <path d="M-30 -195 L30 -185"/><path d="M-26 -110 L28 -100"/><path d="M-26 -30 L28 -20"/><path d="M-26 50 L28 60"/><path d="M-24 130 L26 140"/><path d="M-22 210 L22 220"/>
  </g>
  
  <circle cx="-130" cy="-60" r="105" fill="url(#eyeGlow)"/>
  <circle cx="-130" cy="-60" r="62" fill="#d4ff3a" stroke="#16240c" stroke-width="10"/>
  <circle cx="-124" cy="-56" r="28" fill="#ff2a2a"/>
  <circle cx="-134" cy="-68" r="9" fill="#fff" opacity="0.9"/>
  
  
  <circle cx="130" cy="-60" r="62" fill="#fff" stroke="#1f3f7a" stroke-width="10"/>
  <circle cx="124" cy="-56" r="28" fill="#111"/>
  <circle cx="114" cy="-68" r="9" fill="#fff" opacity="0.9"/></g></svg>
