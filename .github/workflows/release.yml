name: Release

# Push a tag like v0.0.1 (matching "version" in app.json) and this builds every download and publishes
# a GitHub Release with them attached:
#   ZombieTag.apk      Android app (the in-game update check looks for this file)
#   ZombieTag.ipa      iOS app, unsigned (install with Sideloadly or AltStore)
#   ZombieTag-web.zip  the web version, ready to host anywhere
#   SHA256SUMS.txt     checksums of the files above
# The guide page links to releases/latest/download/ZombieTag.apk and ZombieTag.ipa, so keep these names.
# Firebase values come from Settings > Secrets and variables > Actions > Variables; without them the apps run offline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release again (for example v0.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match the app version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match app.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      # The defaults (4 CPU types, 2 GB for Gradle) made the build crawl for 30+ minutes on GitHub's runner.
      # Real phones only need the two ARM types; x86 is for emulators.
      - name: Speed up the build
        working-directory: android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -E '^(reactNativeArchitectures|org.gradle.jvmargs)=' gradle.properties
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ZombieTag.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ZombieTag.apk

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_IOS_OTA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios
      - name: Build unsigned IPA
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qr ZombieTag.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ZombieTag.ipa

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - run: |
          cp dist/index.html dist/404.html
          cp -R site/. dist/
          (cd dist && zip -qr ../ZombieTag-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ZombieTag-web.zip

  publish:
    needs: [android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum ZombieTag.apk ZombieTag.ipa ZombieTag-web.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Zombie Tag ${{ env.TAG }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            out/ZombieTag.apk
            out/ZombieTag.ipa
            out/ZombieTag-web.zip
            out/SHA256SUMS.txt
